services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: remote_update_backend
    ports:
      - "0.0.0.0:8080:8080"  # Bind to all interfaces — accessible from any LAN device
    restart: unless-stopped
    volumes:
      - ./backend/storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
