name: Android CD Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Semantic Version Name (e.g. 0.0.1)'
        required: true
        default: '0.0.1'
      version_code:
        description: 'Monotonic Version Code (e.g. 1)'
        required: true
        default: '1'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build, Sign & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Resolve Release Version
        id: versioning
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V_NAME="${{ github.event.inputs.version_name }}"
            V_CODE="${{ github.event.inputs.version_code }}"
          else
            # Extract version from Git tag v0.0.1 -> 0.0.1
            RAW_TAG="${GITHUB_REF#refs/tags/v}"
            V_NAME="$RAW_TAG"
            # Derive monotonic integer code from commit count or default to 1
            V_CODE=$(git rev-list --count HEAD)
          fi
          echo "Building versionName: $V_NAME, versionCode: $V_CODE"
          echo "version_name=$V_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$V_CODE" >> $GITHUB_OUTPUT

      - name: Resolve Keystore for Deterministic Signing
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding KEYSTORE_BASE64 secret..."
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > /tmp/release.keystore
            echo "keystore_path=/tmp/release.keystore" >> $GITHUB_OUTPUT
          elif [ -f "release.keystore" ]; then
            echo "Using committed release.keystore for continuous updates ($(stat -c%s release.keystore) bytes)"
            echo "keystore_path=$(pwd)/release.keystore" >> $GITHUB_OUTPUT
          else
            echo "No keystore found, using fallback signing"
            echo "keystore_path=" >> $GITHUB_OUTPUT
          fi

      - name: Assemble Release APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'remoteupdate123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'remoteupdate' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'remoteupdate123' }}
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ steps.versioning.outputs.version_name }}" \
            -PversionCode="${{ steps.versioning.outputs.version_code }}"

      - name: Securely Wipe Ephemeral Keystore File
        if: always()
        run: rm -f /tmp/release.keystore

      - name: Package Artifacts & Checksums
        id: artifacts
        run: |
          VERSION="${{ steps.versioning.outputs.version_name }}"
          CODE="${{ steps.versioning.outputs.version_code }}"
          APK_SRC=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)

          APK_DEST="app-release-v${VERSION}.apk"
          cp "$APK_SRC" "$APK_DEST"

          APK_SHA256=$(sha256sum "$APK_DEST" | awk '{print $1}')
          echo "APK SHA256: $APK_SHA256"

          # Generate version.json release manifest
          cat <<EOF > version.json
          {
            "versionCode": ${CODE},
            "versionName": "${VERSION}",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${APK_DEST}",
            "sha256": "${APK_SHA256}",
            "isMandatory": false,
            "releaseNotes": "Automated release v${VERSION} built and signed via GitHub Actions.",
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

          echo "apk_path=$APK_DEST" >> $GITHUB_OUTPUT
          echo "apk_sha256=$APK_SHA256" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release v${{ steps.versioning.outputs.version_name }}"
          tag_name: "v${{ steps.versioning.outputs.version_name }}"
          files: |
            ${{ steps.artifacts.outputs.apk_path }}
            version.json
          body: |
            ## Remote Update Demo v${{ steps.versioning.outputs.version_name }} (Build Code: ${{ steps.versioning.outputs.version_code }})

            ### Download & Installation
            Download the signed release APK below to install on your Android device:
            - **Direct APK:** [`${{ steps.artifacts.outputs.apk_path }}`](https://github.com/${{ github.repository }}/releases/download/v${{ steps.versioning.outputs.version_name }}/${{ steps.artifacts.outputs.apk_path }})
            - **SHA-256 Checksum:** `${{ steps.artifacts.outputs.apk_sha256 }}`
            - **Commit:** `${{ github.sha }}`

            ### Verification
            This APK is compiled, verified with unit tests and Android Lint, and signed automatically via GitHub Actions CI/CD.
          draft: false
          prerelease: false
