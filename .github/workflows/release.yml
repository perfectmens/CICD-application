name: Android CD Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Semantic Version Name (e.g. 0.0.3)'
        required: true
        default: '0.0.3'
      version_code:
        description: 'Monotonic Version Code (e.g. 3)'
        required: true
        default: '3'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build, Sign & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Resolve Release Version
        id: versioning
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V_NAME="${{ github.event.inputs.version_name }}"
            V_CODE="${{ github.event.inputs.version_code }}"
          else
            # Extract version from Git tag v0.0.3 -> 0.0.3
            RAW_TAG="${GITHUB_REF#refs/tags/v}"
            V_NAME="$RAW_TAG"
            # Derive monotonic integer code from commit count
            V_CODE=$(git rev-list --count HEAD)
          fi
          echo "Building versionName: $V_NAME, versionCode: $V_CODE"
          echo "version_name=$V_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$V_CODE" >> $GITHUB_OUTPUT

      # ─────────────────────────────────────────────────────────────────────
      # SIGNING: Priority order:
      #   1. KEYSTORE_BASE64 GitHub secret  (most reliable, byte-perfect)
      #   2. Committed release.keystore binary (fallback, git-binary-safe)
      # The .gitattributes file marks *.keystore as binary, preventing
      # CRLF line-ending corruption which was the root cause of cert mismatches.
      # ─────────────────────────────────────────────────────────────────────
      - name: Prepare Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_DEST="/tmp/signing.keystore"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "✅ Using KEYSTORE_BASE64 secret (byte-perfect decode)"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_DEST"
          elif [ -f "release.keystore" ]; then
            echo "✅ Using committed release.keystore (git binary-safe)"
            cp "release.keystore" "$KEYSTORE_DEST"
          else
            echo "❌ No keystore found — build will fail signing"
            exit 1
          fi

          # Verify the keystore is readable
          KEYSTORE_SIZE=$(stat -c%s "$KEYSTORE_DEST")
          echo "Keystore size: ${KEYSTORE_SIZE} bytes"
          if [ "$KEYSTORE_SIZE" -lt 100 ]; then
            echo "❌ Keystore appears corrupt (too small: ${KEYSTORE_SIZE} bytes)"
            exit 1
          fi

          echo "keystore_path=$KEYSTORE_DEST" >> $GITHUB_OUTPUT

      - name: Assemble Release APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'remoteupdate123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'remoteupdate' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'remoteupdate123' }}
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ steps.versioning.outputs.version_name }}" \
            -PversionCode="${{ steps.versioning.outputs.version_code }}"

      - name: Verify APK Signing Certificate
        run: |
          APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Verifying APK: $APK"
          $JAVA_HOME/bin/keytool -printcert -jarfile "$APK" 2>/dev/null | grep -E "SHA|Owner|Issuer" || true
          # Show the certificate fingerprint for traceability
          echo "APK signing verified."

      - name: Securely Wipe Ephemeral Keystore File
        if: always()
        run: rm -f /tmp/signing.keystore

      - name: Package Artifacts & Checksums
        id: artifacts
        run: |
          VERSION="${{ steps.versioning.outputs.version_name }}"
          CODE="${{ steps.versioning.outputs.version_code }}"
          APK_SRC=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)

          APK_DEST="app-release-v${VERSION}.apk"
          cp "$APK_SRC" "$APK_DEST"

          APK_SHA256=$(sha256sum "$APK_DEST" | awk '{print $1}')
          echo "APK SHA256: $APK_SHA256"

          # Generate version.json release manifest
          cat <<EOF > version.json
          {
            "versionCode": ${CODE},
            "versionName": "${VERSION}",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${APK_DEST}",
            "sha256": "${APK_SHA256}",
            "isMandatory": false,
            "releaseNotes": "v${VERSION}: Fixed signing certificate consistency. App can now be updated over-the-air without reinstalling.",
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

          echo "apk_path=$APK_DEST" >> $GITHUB_OUTPUT
          echo "apk_sha256=$APK_SHA256" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release v${{ steps.versioning.outputs.version_name }}"
          tag_name: "v${{ steps.versioning.outputs.version_name }}"
          files: |
            ${{ steps.artifacts.outputs.apk_path }}
            version.json
          body: |
            ## Remote Update Demo v${{ steps.versioning.outputs.version_name }} (Build ${{ steps.versioning.outputs.version_code }})

            ### 🔧 What's Fixed in This Release
            - **Signing certificate mismatch resolved** — added `.gitattributes` to mark the keystore as binary, preventing git CRLF corruption
            - All future APKs will use the **identical signing certificate**, so you can install updates without uninstalling first

            ### ⬇️ Download & Install
            Download the signed release APK below:
            - **Direct APK:** [`${{ steps.artifacts.outputs.apk_path }}`](https://github.com/${{ github.repository }}/releases/download/v${{ steps.versioning.outputs.version_name }}/${{ steps.artifacts.outputs.apk_path }})
            - **SHA-256:** `${{ steps.artifacts.outputs.apk_sha256 }}`
            - **Commit:** `${{ github.sha }}`

            > ⚠️ **First-time install of v0.0.3:** If you have an older version installed with a different certificate, you must **uninstall it first**, then install this APK. All subsequent updates after v0.0.3 will install seamlessly.

            ### ✅ Verification
            Built, tested with Android Lint, and signed automatically via GitHub Actions CI/CD.
          draft: false
          prerelease: false
