name: Flutter CD Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Semantic Version Name (e.g. 0.0.1)'
        required: true
        default: '0.0.1'
      version_code:
        description: 'Monotonic Version Code (leave empty to derive from git count)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build, Sign & Publish Flutter Release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Resolve Release Version
        id: versioning
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_code }}" ]; then
            V_CODE="${{ github.event.inputs.version_code }}"
          else
            V_CODE=$(git rev-list --count HEAD)
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V_NAME="${{ github.event.inputs.version_name }}"
          else
            RAW_TAG="${GITHUB_REF#refs/tags/v}"
            V_NAME="$RAW_TAG"
          fi

          echo "Building versionName: $V_NAME, versionCode: $V_CODE"
          echo "version_name=$V_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$V_CODE" >> $GITHUB_OUTPUT

      - name: Prepare Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_DEST="/tmp/signing.keystore"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "✅ Using KEYSTORE_BASE64 secret (byte-perfect decode)"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_DEST"
          elif [ -f "release.keystore" ]; then
            echo "✅ Using committed release.keystore (git binary-safe)"
            cp "release.keystore" "$KEYSTORE_DEST"
          else
            echo "❌ No keystore found — build will fail signing"
            exit 1
          fi

          KEYSTORE_SIZE=$(stat -c%s "$KEYSTORE_DEST")
          echo "Keystore size: ${KEYSTORE_SIZE} bytes"
          if [ "$KEYSTORE_SIZE" -lt 100 ]; then
            echo "❌ Keystore appears corrupt (too small: ${KEYSTORE_SIZE} bytes)"
            exit 1
          fi

          echo "keystore_path=$KEYSTORE_DEST" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: flutter pub get

      - name: Assemble Release APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'remoteupdate123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'remoteupdate' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'remoteupdate123' }}
        run: |
          flutter build apk --release \
            --build-name="${{ steps.versioning.outputs.version_name }}" \
            --build-number="${{ steps.versioning.outputs.version_code }}"

      - name: Securely Wipe Ephemeral Keystore File
        if: always()
        run: rm -f /tmp/signing.keystore

      - name: Package Artifacts & Checksums
        id: artifacts
        run: |
          VERSION="${{ steps.versioning.outputs.version_name }}"
          CODE="${{ steps.versioning.outputs.version_code }}"
          APK_SRC=$(find build/app/outputs/flutter-apk/ -name "*release*.apk" | head -n 1)

          APK_DEST="app-release-v${VERSION}.apk"
          cp "$APK_SRC" "$APK_DEST"

          APK_SHA256=$(sha256sum "$APK_DEST" | awk '{print $1}')
          echo "APK SHA256: $APK_SHA256"

          # Standard version manifest for backend and client OTA updates
          cat <<EOF > version.json
          {
            "versionCode": ${CODE},
            "versionName": "${VERSION}",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${APK_DEST}",
            "sha256": "${APK_SHA256}",
            "isMandatory": false,
            "releaseNotes": "Release v${VERSION} (Build ${CODE}) — Built with Flutter, Dual-Tone Neumorphic UI, and MVVM architecture.",
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

          echo "apk_path=$APK_DEST" >> $GITHUB_OUTPUT
          echo "apk_sha256=$APK_SHA256" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release v${{ steps.versioning.outputs.version_name }}"
          tag_name: "v${{ steps.versioning.outputs.version_name }}"
          make_latest: true
          files: |
            ${{ steps.artifacts.outputs.apk_path }}
            version.json
          body: |
            ## Flutter Remote Update Demo v${{ steps.versioning.outputs.version_name }} (Build ${{ steps.versioning.outputs.version_code }})

            ### 🚀 New Features
            - Built with **Flutter 3.x**
            - **Dual-Tone Neumorphic UI**: 90% neutral tactile canvas, 5% orange user intent, 3% teal system state
            - **Mobile MVVM Architecture**: View -> ViewModel -> Repository -> API Client
            - **API Governance**: Fully synchronized with `api-mapping.yaml`
            - **In-App OTA Updates**: Streaming download with SHA-256 verification and automatic package installer prompt

            ### ⬇️ Download & Install
            - **Direct APK:** [`${{ steps.artifacts.outputs.apk_path }}`](https://github.com/${{ github.repository }}/releases/download/v${{ steps.versioning.outputs.version_name }}/${{ steps.artifacts.outputs.apk_path }})
            - **SHA-256:** `${{ steps.artifacts.outputs.apk_sha256 }}`
            - **Commit:** `${{ github.sha }}`
          draft: false
          prerelease: false

      - name: Notify Backend of New Release
        continue-on-error: true
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'http://192.168.68.64:8080' }}
        run: |
          VERSION="${{ steps.versioning.outputs.version_name }}"
          CODE="${{ steps.versioning.outputs.version_code }}"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/app-release-v${VERSION}.apk"
          SHA256="${{ steps.artifacts.outputs.apk_sha256 }}"

          curl -s -X POST "${BACKEND_URL}/api/v1/github/release-published" \
            -H "Content-Type: application/json" \
            -d @version.json || echo "Backend notification skipped or unreachable from runner."
